name: Rust CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Nightly Rust
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: rustfmt, clippy
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libiio-dev pkg-config
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
    - name: Run fmt
      run: |
        cargo fmt --all --check
        cargo fmt --manifest-path esp-pdu-firmware/Cargo.toml --check
    - name: Run clippy
      # Profiles for non-root packages are ignored, we allow this warning in CI for now
      # as it's a workspace-level configuration issue.
      run: cargo clippy --workspace --all-targets -- -D warnings
    - name: Run tests
      run: cargo test --workspace
    - name: Run GNU Radio verification in Docker
      run: make -C sdr-pdu-utils test-gnuradio

  build-host:
    needs: lint-and-test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: ubuntu-latest
            platform: linux-arm64
            target: aarch64-unknown-linux-gnu
            ext: ""
          - os: windows-latest
            platform: windows-amd64
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - os: macos-latest
            platform: macos-universal
            target: universal-apple-darwin
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Install Nightly Rust
      uses: dtolnay/rust-toolchain@nightly
      with:
        targets: ${{ matrix.platform == 'macos-universal' && 'x86_64-apple-darwin,aarch64-apple-darwin' || matrix.target }}
    - name: Install Cross-Compiler (Linux ARM64)
      if: matrix.target == 'aarch64-unknown-linux-gnu'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
    - name: Build host binaries (Linux / Windows)
      if: matrix.platform != 'macos-universal'
      shell: bash
      env:
        CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      run: |
        cargo build --release -p hackrf-pdu-tx -p esp-pdu-tnc -p pdu-proxy --target ${{ matrix.target }}
        mkdir -p dist
        for bin in hackrf-pdu-tx esp-pdu-tnc pdu-proxy; do
          cp "target/${{ matrix.target }}/release/${bin}${{ matrix.ext }}" "dist/${bin}-${{ matrix.platform }}${{ matrix.ext }}"
        done
    - name: Build host binaries (macOS Universal)
      if: matrix.platform == 'macos-universal'
      run: |
        cargo build --release -p hackrf-pdu-tx -p esp-pdu-tnc -p pdu-proxy --target x86_64-apple-darwin
        cargo build --release -p hackrf-pdu-tx -p esp-pdu-tnc -p pdu-proxy --target aarch64-apple-darwin
        mkdir -p dist
        for bin in hackrf-pdu-tx esp-pdu-tnc pdu-proxy; do
          lipo -create \
            "target/x86_64-apple-darwin/release/${bin}" \
            "target/aarch64-apple-darwin/release/${bin}" \
            -output "dist/${bin}-macos-universal"
        done
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: host-${{ matrix.platform }}
        path: dist/*

  build-pluto:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Nightly Rust
      uses: dtolnay/rust-toolchain@nightly
      with:
        targets: arm-unknown-linux-gnueabihf
    - name: Install Cross-Compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-linux-gnueabihf pkg-config
    - name: Cache PlutoSDR Sysroot
      id: cache-sysroot
      uses: actions/cache@v4
      with:
        path: sysroot
        key: sysroot-v0.30
    - name: Download PlutoSDR Sysroot
      if: steps.cache-sysroot.outputs.cache-hit != 'true'
      run: |
        wget https://github.com/analogdevicesinc/plutosdr-fw/releases/download/v0.30/sysroot-v0.30.tar.gz
        tar -xzvf sysroot-v0.30.tar.gz
        # The tarball extracts into a directory named 'staging'
        mv staging sysroot
        # Ensure libiio.so symlink exists for the linker
        if [ ! -f sysroot/usr/lib/libiio.so ] && [ -f sysroot/usr/lib/libiio.so.0 ]; then
          ln -s libiio.so.0 sysroot/usr/lib/libiio.so
        fi
    - name: Build pluto-pdu-tx
      run: |
        # We need to provide the sysroot path to the Makefile
        make release-pluto -C pluto-pdu-tx SYSROOT=${{ github.workspace }}/sysroot
        mkdir -p dist
        cp target/arm-unknown-linux-gnueabihf/release/pluto-pdu-tx dist/pluto-pdu-tx-linux-armhf
    - name: Upload Artifact (PlutoSDR ARM)
      uses: actions/upload-artifact@v4
      with:
        name: pluto-pdu-tx-linux-armhf
        path: dist/pluto-pdu-tx-linux-armhf

  build-esp-firmware:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Nightly Rust
      uses: dtolnay/rust-toolchain@nightly
    - name: Install espup and espflash
      uses: taiki-e/install-action@v2
      with:
        tool: espup,espflash@3.3.0
    - name: Cache Xtensa ESP toolchain
      id: cache-esp
      uses: actions/cache@v4
      with:
        path: |
          ~/.rustup/toolchains/esp
          ~/export-esp.sh
        key: esp-toolchain-1.82.0.3
    - name: Install Xtensa ESP toolchain
      if: steps.cache-esp.outputs.cache-hit != 'true'
      run: espup install --targets esp32,esp32s3 --toolchain-version 1.82.0.3 --export-file ~/export-esp.sh
    - name: Rust Cache (esp-pdu-firmware)
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: esp-pdu-firmware
    - name: Build ESP32 and ESP32-S3 firmware
      run: |
        source ~/export-esp.sh
        mkdir -p dist
        cd esp-pdu-firmware
        cargo +esp build --release --target xtensa-esp32-none-elf --features esp32 --no-default-features
        cargo +esp build --release --target xtensa-esp32s3-none-elf --features esp32s3 --no-default-features
        cp target/xtensa-esp32-none-elf/release/esp-pdu-firmware ../dist/esp-pdu-firmware-esp32.elf
        cp target/xtensa-esp32s3-none-elf/release/esp-pdu-firmware ../dist/esp-pdu-firmware-esp32s3.elf
        espflash save-image --chip esp32 --merge target/xtensa-esp32-none-elf/release/esp-pdu-firmware ../dist/esp-pdu-firmware-esp32.bin
        espflash save-image --chip esp32s3 --merge target/xtensa-esp32s3-none-elf/release/esp-pdu-firmware ../dist/esp-pdu-firmware-esp32s3.bin
    - name: Upload Firmware Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: esp-pdu-firmware
        path: dist/*

  release:
    needs: [build-host, build-pluto, build-esp-firmware]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-assets
        merge-multiple: true
    - name: Generate SHA256SUMS.txt
      working-directory: release-assets
      run: sha256sum * > SHA256SUMS.txt
    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: release-assets/*
        generate_release_notes: true
